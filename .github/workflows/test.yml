name: Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          bun-download-url: https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Run unit tests
        run: bun test
